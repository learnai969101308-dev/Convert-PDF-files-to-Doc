<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Python Professional Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Khmer OS Siemreap', sans-serif; }
        .main-card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); background: #fff; padding: 30px; margin-top: 40px; }
        .img-container { max-height: 400px; margin-bottom: 15px; }
        .img-container img { max-width: 100%; display: block; margin: auto; }
    </style>
</head>
<body>
    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="main-card">
                    <h3 class="text-center text-primary fw-bold mb-4">🚀 ប្រព័ន្ធបម្លែងឯកសារឆ្លាតវៃ</h3>
                    
                    <ul class="nav nav-tabs mb-4 justify-content-center" id="myTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-bold" data-bs-toggle="tab" data-bs-target="#pdf-tab" type="button">📄 បម្លែង PDF</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#img-tab" type="button">🖼️ កាត់រូបភាព & បម្លែងជា Word</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- ផ្នែកទី១: PDF Converter -->
                        <div class="tab-pane fade show active" id="pdf-tab">
                            <form action="/convert" method="POST" enctype="multipart/form-data" onsubmit="handlePdfSubmit()">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">ជ្រើសរើសឯកសារ PDF៖</label>
                                    <input class="form-control" type="file" name="file" accept=".pdf" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-bold">ជ្រើសរើសទម្រង់លទ្ធផល៖</label>
                                    <select class="form-select" name="type">
                                        <option value="word">📄 Word (.docx)</option>
                                        <option value="excel">📊 Excel (.xlsx) [រៀបចំកាឡោនឆ្លាតវៃ]</option>
                                        <option value="pptx">📽️ PowerPoint (.pptx)</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="pdfBtn">ចាប់ផ្តើមបម្លែង និងទាញយក</button>
                            </form>
                        </div>

                        <!-- ផ្នែកទី២: Image Processing & Word -->
                        <div class="tab-pane fade" id="img-tab">
                            <div class="mb-3">
                                <label class="form-label fw-bold">ជ្រើសរើសរូបភាព៖</label>
                                <input class="form-control" type="file" id="imageInput" accept="image/*">
                            </div>
                            
                            <div class="img-container border rounded p-2 bg-light text-center" id="previewArea" style="display:none;">
                                <img id="imagePreview" src="" alt="Preview">
                            </div>

                            <div id="imgActionArea" style="display:none;" class="mt-3">
                                <div class="row g-2">
                                    <div class="col-6">
                                        <button type="button" class="btn btn-success w-100 fw-bold" onclick="submitImageAction('clean')">
                                            ✂️ ទាញយករូបភាព HD
                                        </button>
                                    </div>
                                    <div class="col-6">
                                        <button type="button" class="btn btn-info w-100 fw-bold text-white" onclick="submitImageAction('word')">
                                            📄 បម្លែងអត្ថបទជា Word
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="text-center mt-3 text-muted" id="imgLoading" style="display:none;">
                                <div class="spinner-border spinner-border-sm text-primary me-2"></div>កំពុងដំណើរការ... សូមរង់ចាំ...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        let cropper = null;
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewArea = document.getElementById('previewArea');
        const imgActionArea = document.getElementById('imgActionArea');

        imageInput.addEventListener('change', function (e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    imagePreview.src = event.target.result;
                    previewArea.style.display = 'block';
                    imgActionArea.style.display = 'block';
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(imagePreview, { aspectRatio: NaN, viewMode: 1 });
                };
                reader.readAsDataURL(files[0]);
            }
        });

        function handlePdfSubmit() {
            const btn = document.getElementById('pdfBtn');
            btn.innerText = 'កំពុងដំណើរការ... ឯកសារនឹងទាញយកដោយស្វ័យប្រវត្តិ';
            btn.classList.add('disabled');
            setTimeout(() => {
                btn.innerText = 'ចាប់ផ្តើមបម្លែង និងទាញយក';
                btn.classList.remove('disabled');
            }, 10000);
        }

        function submitImageAction(actionType) {
            if (!cropper) return;
            document.getElementById('imgLoading').style.display = 'block';
            
            const cropData = cropper.getData(true);
            const formData = new FormData();
            formData.append('image_file', imageInput.files[0]);
            formData.append('action', actionType);
            formData.append('x', cropData.x);
            formData.append('y', cropData.y);
            formData.append('w', cropData.width);
            formData.append('h', cropData.height);

            fetch('/process_image', { method: 'POST', body: formData })
            .then(res => res.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = actionType === 'word' ? "Image_to_Word_Result.docx" : "HD_Cleaned_Image.png";
                document.body.appendChild(a);
                a.click();
                a.remove();
                document.getElementById('imgLoading').style.display = 'none';
            })
            .catch(err => {
                alert('មានបញ្ហាក្នុងការដំណើរការ!');
                document.getElementById('imgLoading').style.display = 'none';
            });
        }
    </script>
</body>
</html>
